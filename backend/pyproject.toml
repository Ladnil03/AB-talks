[project]
name = "interview-agent-backend"
version = "0.1.0"
description = "FastAPI & LangGraph AI Interview Agent Backend"
authors = [{ name = "Interview Agent Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.26",
    "anthropic>=0.19.0",
    "groq>=0.4.2",
    "openai>=1.14.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
